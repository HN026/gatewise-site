global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: gatewise
    static_configs:
      - targets: [host.docker.internal:8080]
        labels: {deployment: proxy, profile: fixed}
      - targets: [host.docker.internal:8088]
        labels: {deployment: proxy, profile: adaptive}
      - targets: [host.docker.internal:9092]
        labels: {deployment: middleware, profile: fixed}
      - targets: [host.docker.internal:9093]
        labels: {deployment: middleware, profile: adaptive}
