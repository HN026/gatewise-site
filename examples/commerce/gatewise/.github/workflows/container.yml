name: Publish proxy image
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v0.11.1
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/hn026/gatewise:${{ inputs.tag || github.event.release.tag_name }}
          build-args: VERSION=${{ inputs.tag || github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate the built image
        env:
          IMAGE: ghcr.io/hn026/gatewise:${{ inputs.tag || github.event.release.tag_name }}
        run: docker run --rm --read-only --cap-drop=ALL -e GATEWISE_SERVICE_ORDERS_URL=http://example.invalid "$IMAGE" -config /etc/gatewise/config.json -check-config
      - name: Publish the validated image
        env:
          IMAGE: ghcr.io/hn026/gatewise:${{ inputs.tag || github.event.release.tag_name }}
        run: docker push "$IMAGE"
