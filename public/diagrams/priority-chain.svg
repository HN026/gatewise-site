<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="240" viewBox="0 0 1120 240"><rect width="1120" height="240" fill="#101b16"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#79d7bd"/></marker></defs><rect x="25" y="45" width="245" height="105" rx="8" fill="#182b22" stroke="#718b7c"/><text x="147" y="85" fill="#e3ede6" text-anchor="middle" font-family="sans-serif" font-size="19">Caller</text><text x="147" y="119" fill="#abc0b3" text-anchor="middle" font-family="sans-serif" font-size="15">Untrusted metadata</text><path d="M271 96H296" stroke="#79d7bd" marker-end="url(#arrow)"/><rect x="300" y="45" width="245" height="105" rx="8" fill="#182b22" stroke="#718b7c"/><text x="422" y="85" fill="#e3ede6" text-anchor="middle" font-family="sans-serif" font-size="19">Authenticated ingress</text><text x="422" y="119" fill="#abc0b3" text-anchor="middle" font-family="sans-serif" font-size="15">Strip or overwrite</text><path d="M546 96H571" stroke="#79d7bd" marker-end="url(#arrow)"/><rect x="575" y="45" width="245" height="105" rx="8" fill="#182b22" stroke="#718b7c"/><text x="697" y="85" fill="#e3ede6" text-anchor="middle" font-family="sans-serif" font-size="19">Orders service</text><text x="697" y="119" fill="#abc0b3" text-anchor="middle" font-family="sans-serif" font-size="15">Resolve tier + cohort</text><path d="M821 96H846" stroke="#79d7bd" marker-end="url(#arrow)"/><rect x="850" y="45" width="245" height="105" rx="8" fill="#182b22" stroke="#718b7c"/><text x="972" y="85" fill="#e3ede6" text-anchor="middle" font-family="sans-serif" font-size="19">Catalog service</text><text x="972" y="119" fill="#abc0b3" text-anchor="middle" font-family="sans-serif" font-size="15">Trust peer; enforce locally</text><text x="560" y="196" fill="#abc0b3" text-anchor="middle" font-family="sans-serif" font-size="16">Each service enforces its own capacity. Shared cohort ordering does not imply identical admission.</text></svg>