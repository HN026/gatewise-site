<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="270" viewBox="0 0 1060 270"><rect width="1060" height="270" fill="#101b16"/><text x="24" y="30" fill="#dce8df" font-family="sans-serif" font-size="18">Example: 8 service slots, target share 2 per tenant, total borrowing ceiling 8</text><rect x="24" y="55" width="316" height="148" rx="6" fill="#17271f" stroke="#496451"/><text x="39" y="83" fill="#dce8df" font-family="sans-serif" font-size="17">1. Only A is active</text><rect x="38" y="104" width="29" height="34" rx="3" fill="#76d9bc"/><text x="52" y="127" text-anchor="middle" fill="#101b16" font-family="sans-serif" font-size="16">A</text><rect x="74" y="104" width="29" height="34" rx="3" fill="#76d9bc"/><text x="88" y="127" text-anchor="middle" fill="#101b16" font-family="sans-serif" font-size="16">A</text><rect x="110" y="104" width="29" height="34" rx="3" fill="#ed8b76"/><text x="124" y="127" text-anchor="middle" fill="#101b16" font-family="sans-serif" font-size="16">A</text><rect x="146" y="104" width="29" height="34" rx="3" fill="#ed8b76"/><text x="160" y="127" text-anchor="middle" fill="#101b16" font-family="sans-serif" font-size="16">A</text><rect x="182" y="104" width="29" height="34" rx="3" fill="#ed8b76"/><text x="196" y="127" text-anchor="middle" fill="#101b16" font-family="sans-serif" font-size="16">A</text><rect x="218" y="104" width="29" height="34" rx="3" fill="#ed8b76"/><text x="232" y="127" text-anchor="middle" fill="#101b16" font-family="sans-serif" font-size="16">A</text><rect x="254" y="104" width="29" height="34" rx="3" fill="#ed8b76"/><text x="268" y="127" text-anchor="middle" fill="#101b16" font-family="sans-serif" font-size="16">A</text><rect x="290" y="104" width="29" height="34" rx="3" fill="#ed8b76"/><text x="304" y="127" text-anchor="middle" fill="#101b16" font-family="sans-serif" font-size="16">A</text><text x="39" y="170" fill="#afc5b7" font-family="sans-serif" font-size="12">A can use up to 8 total slots.</text><rect x="372" y=