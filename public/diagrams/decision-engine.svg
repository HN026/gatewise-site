<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="450" viewBox="0 0 1040 450"><rect width="1040" height="450" fill="#f5f2e9"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#244d43"/></marker></defs><path d="M260 70 L330 70" stroke="#244d43" stroke-width="2" marker-end="url(#a)"/><path d="M260 235 L330 235" stroke="#244d43" stroke-width="2" marker-end="url(#a)"/><path d="M460 110 L460 195" stroke="#244d43" stroke-width="2" marker-end="url(#a)"/><path d="M590 235 L660 235" stroke="#244d43" stroke-width="2" marker-end="url(#a)"/><path d="M830 275 L830 330" stroke="#244d43" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="30" width="230" height="80" rx="8" fill="#fffdf7" stroke="#244d43"/><text x="145.0" y="60" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e34">Background providers</text><text x="145.0" y="86" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4b655b">HTTP or application sampler</text><rect x="330" y="30" width="260" height="80" rx="8" fill="#fffdf7" stroke="#244d43"/><text x="460.0" y="60" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e34">Bounded observation cache</text><text x="460.0" y="86" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4b655b">value · measured time · state</text><rect x="30" y="195" width="230" height="80" rx="8" fill="#fffdf7" stroke="#244d43"/><text x="145.0" y="225" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e34">Trusted request identity</text><text x="145.0" y="251" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4b655b">tenant · priority · resource</text><rect x="330" y="195" width="260" height="80" rx="8" fill="#fffdf7" stroke="#244d43"/><text x="460.0" y="225" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e34">Combine matching signals</text><text x="460.0" y="251" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4b655b">smallest cap · reject wins</text><rect x="660" y="195" width="340" height="80" rx="8" fill="#fffdf7" stroke="#244d43"/><text x="830.0" y="225" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e34">Hard admission controls</text><text x="830.0" y="251" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4b655b">tenant → priority/cohort → capacity</text><rect x="660" y="330" width="340" height="80" rx="8" fill="#fffdf7" stroke="#244d43"/><text x="830.0" y="360" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e34">Handler or structured 503</text><text x="830.0" y="386" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4b655b">explanation names the failed stage</text><path d="M460 275 L460 370 L660 370" stroke="#244d43" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="550" y="395" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4b655b">explicit signal rejection</text><text x="175" y="335" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4b655b">Observe: proposal only</text><text x="175" y="358" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4b655b">Enforce: tighten or reject</text></svg>