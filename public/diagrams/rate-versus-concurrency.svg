<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" role="img" aria-label="rate-versus-concurrency">
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#91ab9a"/></marker></defs>
<rect width="880" height="240" fill="#101a13"/>
<path d="M260 53.0 H290.0 V53.0 H317" fill="none" stroke="#91ab9a" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M560 53.0 H590.0 V53.0 H617" fill="none" stroke="#91ab9a" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M260 183.0 H290.0 V183.0 H317" fill="none" stroke="#91ab9a" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M560 183.0 H590.0 V183.0 H617" fill="none" stroke="#ef8d7d" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="20" y="20" width="240" height="66" rx="2" fill="#142019" stroke="#4a6051"/>
<text x="140.0" y="45" fill="#dce7df" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Arrival cap: 120 RPS</text>
<text x="140.0" y="66" fill="#a1b7a8" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">Rate limit permits these arrivals</text>
<rect x="320" y="20" width="240" height="66" rx="2" fill="#142019" stroke="#4a6051"/>
<text x="440.0" y="45" fill="#dce7df" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Duration rises to 500ms</text>
<text x="440.0" y="66" fill="#a1b7a8" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">Previously 50ms at the same rate</text>
<rect x="620" y="20" width="240" height="66" rx="2" fill="#142019" stroke="#4a6051"/>
<text x="740.0" y="45" fill="#dce7df" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">About 60 active</text>
<text x="740.0" y="66" fill="#a1b7a8" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">Stable average: 120 × 0.5s</text>
<rect x="20" y="150" width="240" height="66" rx="2" fill="#142019" stroke="#6faf91"/>
<text x="140.0" y="175" fill="#dce7df" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Concurrency ceiling: 20</text>
<text x="140.0" y="196" fill="#a1b7a8" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">Example limit, chosen by operator</text>
<rect x="320" y="150" width="240" height="66" rx="2" fill="#142019" stroke="#6faf91"/>
<text x="440.0" y="175" fill="#dce7df" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">At most 20 active</text>
<text x="440.0" y="196" fill="#a1b7a8" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">Slots held until handlers return</text>
<rect x="620" y="150" width="240" height="66" rx="2" fill="#142019" stroke="#4a6051"/>
<text x="740.0" y="175" fill="#dce7df" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Excess arrivals: 503</text>
<text x="740.0" y="196" fill="#a1b7a8" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">No additional admission queue</text>
</svg>